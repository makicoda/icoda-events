<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meet Us at CoinFest Asia 2026 — Story Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #2563EB;
    --accent-green: #84CC16;
    --bg: #ffffff;
    --text: #0D0D0D;
    --muted: #94A3B8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #E9EDF3;
    font-family: 'Inter', sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 0 120px;
  }

  /* ---------- controls ---------- */
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    z-index: 999;
  }

  .controls button {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.04em;
    color: #fff;
    background: var(--accent);
    border: none;
    padding: 12px 26px;
    border-radius: 100px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.3);
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .controls button:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(37, 99, 235, 0.38); }
  .controls button:active { transform: translateY(0); }

  .controls button.secondary {
    background: #fff;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    box-shadow: none;
  }

  /* ---------- stage / scaling wrapper ---------- */
  .stage {
    width: 1080px;
    height: 1920px;
  }

  .card {
    width: 1080px;
    height: 1920px;
    position: relative;
    background: var(--bg);
    overflow: hidden;
    transform: scale(0.38);
    transform-origin: top center;
    box-shadow: 0 30px 80px rgba(15, 23, 42, 0.25);
    font-family: 'Inter', sans-serif;
  }

  .card.scale-full { transform: scale(1); box-shadow: none; }

  /* ================= BANNER TOP STRIP (0-260px) ================= */
  .banner-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 260px;
    background: #F4F6FA;
    overflow: hidden;
    z-index: 1;
  }

  .logo-lockup {
    position: absolute;
    top: 50px;
    right: 72px;
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .logo-icon { width: 78px; height: 78px; flex-shrink: 0; }

  .logo-text .line1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 40px;
    line-height: 1;
    color: #26282B;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .logo-text .line2 {
    margin-top: 6px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    white-space: nowrap;
  }

  .logo-text .line2 .asia {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 40px;
    line-height: 1;
    color: #26282B;
    letter-spacing: 0.01em;
  }

  .logo-text .line2 .yr {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 500;
    font-size: 34px;
    line-height: 1;
    color: #26282B;
  }

  .dates-line {
    position: absolute;
    top: 172px;
    right: 72px;
    text-align: right;
  }

  .dates-line .dates {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .dates-line .place {
    margin-top: 2px;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 16px;
    color: var(--muted);
  }

  /* ================= BANNER PHOTO (260-620px) ================= */
  .banner-photo {
    position: absolute;
    top: 260px;
    left: 0;
    width: 100%;
    height: 360px;
    overflow: hidden;
    z-index: 1;
  }

  .banner-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .ph-banner {
    background: linear-gradient(120deg, #2563EB 0%, #60A5FA 55%, #84CC16 100%);
  }

  /* ================= DECORATIVE SHAPES ================= */
  .diamond-large-outline {
    position: absolute;
    left: -40px;
    top: 1200px;
    width: 200px;
    height: 200px;
    opacity: 0.10;
    z-index: 0;
  }

  .diamond-small-solid {
    position: absolute;
    right: 96px;
    top: 760px;
    width: 26px;
    height: 26px;
    background: var(--accent);
    opacity: 0.35;
    transform: rotate(45deg);
    border-radius: 4px;
    z-index: 2;
  }

  .lime-blob {
    position: absolute;
    right: -60px;
    top: 1620px;
    width: 300px;
    height: 200px;
    background: var(--accent-green);
    opacity: 0.9;
    border-radius: 60% 40% 55% 45% / 50% 60% 40% 50%;
    z-index: 0;
  }

  /* ================= HEADLINE ================= */
  .headline-block {
    position: absolute;
    top: 720px;
    left: 0;
    width: 100%;
    padding-left: 72px;
    z-index: 2;
  }

  .headline {
    font-family: 'Anton', sans-serif;
    font-size: 148px;
    line-height: 0.9;
    text-transform: uppercase;
  }

  .headline .l1 { color: var(--text); }
  .headline .l2 { color: var(--accent); }

  .headline .tag26 {
    display: inline-block;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 40px;
    color: var(--text);
    vertical-align: super;
    letter-spacing: 0.02em;
    margin-left: 6px;
  }

  .location-line {
    margin-top: 30px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 26px;
    color: var(--muted);
  }

  .location-line svg { width: 24px; height: 24px; fill: var(--accent); flex-shrink: 0; }

  /* ================= PROMO PILL ================= */
  .promo-pill {
    position: absolute;
    top: 1090px;
    left: 72px;
    display: flex;
    align-items: center;
    gap: 22px;
    background: linear-gradient(100deg, var(--accent) 0%, #3B82F6 100%);
    border-radius: 20px;
    padding: 22px 40px;
    box-shadow: 0 14px 34px rgba(37, 99, 235, 0.28);
    z-index: 2;
  }

  .promo-icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .promo-icon svg { width: 28px; height: 28px; fill: #fff; }

  .promo-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: rgba(255, 255, 255, 0.75);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .promo-code {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 40px;
    color: #fff;
    letter-spacing: 0.03em;
  }

  /* ================= MEET US THERE ================= */
  .meet-label {
    position: absolute;
    top: 1250px;
    left: 72px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 24px;
    color: var(--muted);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    z-index: 2;
  }

  /* ================= REP ROW ================= */
  .rep-row {
    position: absolute;
    top: 1320px;
    left: 72px;
    right: 72px;
    display: flex;
    align-items: center;
    gap: 44px;
    z-index: 2;
  }

  .rep-photo {
    width: 260px;
    height: 260px;
    border-radius: 24px;
    border: 3px solid var(--accent);
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
  }

  .rep-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .ph-rep {
    background: linear-gradient(160deg, #2563EB 0%, #1E40AF 100%);
  }

  .rep-name {
    font-family: 'Anton', sans-serif;
    font-size: 68px;
    line-height: 0.95;
    color: var(--text);
    text-transform: uppercase;
  }

  .rep-role {
    margin-top: 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 30px;
    color: var(--accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .rep-connect {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .rep-connect svg { width: 24px; height: 24px; fill: var(--accent); flex-shrink: 0; }

  .rep-connect span {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 20px;
    color: var(--muted);
  }

  /* ================= BOTTOM GRADIENT LINE ================= */
  .bottom-gradient-line {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-green) 100%);
    z-index: 4;
  }

  /* ================= PRINT ================= */
  @media print {
    body { padding: 0; background: #fff; }
    .controls { display: none; }
    .card {
      transform: none !important;
      box-shadow: none !important;
    }
    @page { size: 1080px 1920px; margin: 0; }
  }
</style>
</head>
<body>

  <div class="controls">
    <button onclick="window.print()">🖨 Save / Print</button>
    <button class="secondary" onclick="setScale(1)">↗ Full size</button>
    <button class="secondary" onclick="setScale(0.38)">↙ Fit</button>
  </div>

  <div class="stage">
    <div class="card" id="card">

      <!-- ================= BANNER TOP STRIP ================= -->
      <div class="banner-top">
        <div class="logo-lockup">
          <svg class="logo-icon" viewBox="0 0 100 100">
            <g fill="#2563EB">
              <path d="M50,50 C38,42 28,26 33,12 C36,4 48,2 54,9 C60,17 58,36 50,50 Z"/>
              <path d="M50,50 C60,40 78,34 90,42 C97,47 96,59 87,63 C77,68 59,61 50,50 Z"/>
              <path d="M50,50 C58,62 60,81 48,90 C41,95 30,90 29,81 C27,70 39,56 50,50 Z"/>
              <path d="M50,50 C40,58 22,63 11,54 C4,48 6,37 16,34 C27,30 43,39 50,50 Z"/>
              <path d="M50,50 C44,38 44,20 55,10 C61,5 71,11 70,20 C69,31 58,44 50,50 Z" opacity="0.85"/>
            </g>
            <circle cx="50" cy="50" r="11" fill="#0B2C8C"/>
          </svg>
          <div class="logo-text">
            <div class="line1">COINFEST</div>
            <div class="line2"><span class="asia">ASIA</span><span class="yr">2026</span></div>
          </div>
        </div>
        <div class="dates-line">
          <div class="dates">20&ndash;21 August</div>
          <div class="place">Bali, Indonesia</div>
        </div>
      </div>

      <!-- ================= BANNER PHOTO ================= -->
      <div class="banner-photo ph-banner">
        <img src="./banner.jpg" alt="" onerror="this.style.display='none';">
      </div>

      <!-- ================= HEADLINE ================= -->
      <div class="headline-block">
        <div class="headline">
          <div class="l1">COINFEST</div>
          <div class="l2">ASIA<span class="tag26">2026</span></div>
        </div>
        <div class="location-line">
          <svg viewBox="0 0 24 24"><path d="M12,2C8.13,2,5,5.13,5,9c0,5.25,7,13,7,13s7-7.75,7-13C19,5.13,15.87,2,12,2z M12,11.5c-1.38,0-2.5-1.12-2.5-2.5 s1.12-2.5,2.5-2.5s2.5,1.12,2.5,2.5S13.38,11.5,12,11.5z"/></svg>
          <span>Bali, Indonesia &middot; August 20&ndash;21</span>
        </div>
      </div>

      <div class="diamond-small-solid"></div>

      <!-- ================= PROMO PILL ================= -->
      <div class="promo-pill">
        <div class="promo-icon">
          <svg viewBox="0 0 24 24"><path d="M20,12c0-1.1,0.9-2,2-2V6c0-1.1-0.9-2-2-2H4C2.9,4,2,4.9,2,6v4c1.1,0,2,0.9,2,2s-0.9,2-2,2v4c0,1.1,0.9,2,2,2h16 c1.1,0,2-0.9,2-2v-4C20.9,14,20,13.1,20,12z M13,17.5h-2v-2h2V17.5z M13,13h-2v-2h2V13z M13,8.5h-2v-2h2V8.5z"/></svg>
        </div>
        <div>
          <div class="promo-label">Promo code</div>
          <div class="promo-code">CFA10OFFICODA</div>
        </div>
      </div>

      <svg class="diamond-large-outline" viewBox="0 0 100 100">
        <rect x="15" y="15" width="70" height="70" fill="none" stroke="#2563EB" stroke-width="3" transform="rotate(45 50 50)"/>
      </svg>

      <!-- ================= MEET US THERE ================= -->
      <div class="meet-label">Meet us there</div>

      <!-- ================= REP ROW ================= -->
      <div class="rep-row">
        <div class="rep-photo ph-rep">
          <img src="./artyom.jpg" alt="Artyom Abbasov" onerror="this.style.display='none';">
        </div>
        <div>
          <div class="rep-name">Artyom<br>Abbasov</div>
          <div class="rep-role">CMO</div>
          <div class="rep-connect">
            <svg viewBox="0 0 24 24"><path d="M21.05,3.62,2.87,10.7a1,1,0,0,0,.07,1.88l4.68,1.56,1.8,5.84a1,1,0,0,0,1.72.36l2.6-2.85,4.65,3.42a1,1,0,0,0,1.58-.6L22,4.44A1,1,0,0,0,21.05,3.62ZM9.4,13.83l-.9,3-1.2-3.9,9.34-6.14ZM10,17.6l-.86-2.8,1.5,1.1Zm7.94,1.06-4-2.94,4.86-8.02Z"/></svg>
            <span>Let's connect</span>
          </div>
        </div>
      </div>

      <div class="lime-blob"></div>

      <div class="bottom-gradient-line"></div>

    </div>
  </div>

<script>
  function setScale(v) {
    var card = document.getElementById('card');
    card.classList.remove('scale-full');
    if (v === 1) {
      card.classList.add('scale-full');
    } else {
      card.style.transform = 'scale(' + v + ')';
    }
  }
</script>

</body>
</html>
