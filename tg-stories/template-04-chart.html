<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Template 04 — Chart Silhouette Background</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Onest',sans-serif; background:#1B1C2E; display:flex; gap:24px; padding:48px; flex-wrap:wrap; align-items:flex-start; }
.slide{width:360px;height:640px;background:linear-gradient(160deg,#FAFBFD 0%,#EFF2F7 55%,#F7F9FC 100%);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;padding:36px 32px;flex-shrink:0;position:relative;isolation:isolate;}
.bg-deco{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;border-radius:24px;}
.label{font-size:11px;font-weight:600;color:#2D344D;letter-spacing:0.08em;text-transform:uppercase;text-align:center;margin-bottom:28px;}
</style>
</head>
<body>

<!-- ============================================================
  SHARED BACKGROUND MOTIF — "Chart Silhouette"
  Same light neutral base as templates 02/03. Decoration: an
  ascending bar/candlestick silhouette along the bottom edge
  (rising left-to-right) with a faint dashed trend line on top,
  two bars tinted brand blue as the "win" accent. Ties the visual
  directly to results/growth without needing real numbers.
============================================================= -->

<!-- SLIDE 1 — LABEL -->
<div class="slide">
  <div class="bg-deco" aria-hidden="true">
    <svg width="360" height="640" viewBox="0 0 360 640" xmlns="http://www.w3.org/2000/svg">
      <!-- faint chart gridlines -->
      <g stroke="#9AA7BC" stroke-opacity="0.08" stroke-width="1">
        <line x1="0" y1="560" x2="360" y2="560"/>
        <line x1="0" y1="480" x2="360" y2="480"/>
        <line x1="0" y1="400" x2="360" y2="400"/>
      </g>
      <!-- ascending bars -->
      <g>
        <rect x="12"  y="580" width="16" height="40"  fill="#C9D3E0" fill-opacity="0.45"/>
        <rect x="36"  y="565" width="16" height="55"  fill="#C9D3E0" fill-opacity="0.45"/>
        <rect x="60"  y="575" width="16" height="45"  fill="#C9D3E0" fill-opacity="0.45"/>
        <rect x="84"  y="550" width="16" height="70"  fill="#C9D3E0" fill-opacity="0.45"/>
        <rect x="108" y="560" width="16" height="60"  fill="#C9D3E0" fill-opacity="0.45"/>
        <rect x="132" y="530" width="16" height="90"  fill="#C9D3E0" fill-opacity="0.45"/>
        <rect x="156" y="545" width="16" height="75"  fill="#C9D3E0" fill-opacity="0.45"/>
        <rect x="180" y="510" width="16" height="110" fill="#C9D3E0" fill-opacity="0.45"/>
        <rect x="204" y="495" width="16" height="125" fill="#C9D3E0" fill-opacity="0.45"/>
        <rect x="228" y="470" width="16" height="150" fill="#C9D3E0" fill-opacity="0.45"/>
        <rect x="252" y="485" width="16" height="135" fill="#C9D3E0" fill-opacity="0.45"/>
        <rect x="276" y="450" width="16" height="170" fill="#3C61E2" fill-opacity="0.22"/>
        <rect x="300" y="430" width="16" height="190" fill="#C9D3E0" fill-opacity="0.45"/>
        <rect x="324" y="410" width="16" height="210" fill="#3C61E2" fill-opacity="0.25"/>
      </g>
      <!-- trend line across bar tops -->
      <polyline points="20,600 44,585 68,595 92,570 116,580 140,550 164,565 188,530 212,515 236,490 260,505 284,470 308,450 332,430"
                fill="none" stroke="#3C61E2" stroke-opacity="0.30" stroke-width="1.4" stroke-dasharray="4 4"/>
    </svg>
  </div>
  <div class="label">{{S1_LABEL}}</div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;">
    <div style="font-size:64px;font-weight:800;color:#3C61E2;line-height:1.1;">{{S1_HIGHLIGHT}}</div>
    <div style="font-size:26px;font-weight:600;color:#2D344D;line-height:1.35;margin-top:20px;">{{S1_DESCRIPTION}}</div>
  </div>
</div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;">
    <div style="font-size:26px;font-weight:700;color:#2D344D;line-height:1.3;margin-bottom:18px;">{{S2_HEADLINE}}</div>
    <div style="border-top:1px solid #D5DBE5;margin:14px 0;"></div>
    <div style="font-size:14px;color:#7C8AA0;line-height:1.6;">{{S2_BODY}}</div>
  </div>
</div>

    <div style="font-size:28px;font-weight:800;color:#2D344D;line-height:1.25;margin-bottom:22px;">{{S3_HEADLINE}}</div>
    <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;"><span style="color:#3C61E2;font-size:15px;font-weight:700;flex-shrink:0;margin-top:1px;">&#10003;</span><span style="font-size:14px;font-weight:500;color:#2D344D;line-height:1.45;">{{S3_RESULT_1}}</span></div>
