<!DOCTYPE html>

<meta charset="UTF-8">
<title>Template 06 — Candlestick Ticker Background</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Onest',sans-serif; background:#1B1C2E; display:flex; gap:24px; padding:48px; flex-wrap:wrap; align-items:flex-start; }
.slide{width:360px;height:640px;background:linear-gradient(160deg,#FAFBFD 0%,#EFF2F7 55%,#F7F9FC 100%);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;padding:36px 32px;flex-shrink:0;position:relative;isolation:isolate;}
.bg-deco{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;border-radius:24px;}
.label{font-size:11px;font-weight:600;color:#2D344D;letter-spacing:0.08em;text-transform:uppercase;text-align:center;margin-bottom:28px;}

<!-- ============================================================
  SHARED BACKGROUND MOTIF — "Candlestick Ticker"
  Same light neutral base. Decoration: a faint trading-terminal
  grid (thin horizontal/vertical axis lines) scattered with small
  candlesticks (body + wick) across the whole canvas, not just one
  edge — reads as a live price ticker behind the copy. Two candles
  tinted brand blue as accents, rest neutral gray.
============================================================= -->
