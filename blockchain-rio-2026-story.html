<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockchain.Rio 2026 — Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #00e0a8;       /* swap this to re-theme the whole card */
    --bg: #0a0a0a;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #1c1c1c;
    font-family: 'Inter', sans-serif;
  }

  /* On-screen preview chrome — none of this exports, it just frames the story
     card so it's easy to see at real size in a browser tab. */
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 40px 20px;
  }

  .toolbar {
    display: flex;
    gap: 12px;
  }

  .toolbar button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
  }

  .toolbar button:hover { opacity: 0.85; }

  /* ===== The exportable story card: fixed 1080x1920 ===== */
  .story {
    position: relative;
    width: 1080px;
    height: 1920px;
    background: var(--bg);
    overflow: hidden;
    color: var(--white);
    flex-shrink: 0;
  }

  /* 1. Hero already carries its own logo mark (top-right, baked into the
     artwork), so no separate top-left brand overlay is drawn on top of it. */

  /* 2. Hero — the supplied banner is a fixed 1920x1080 (16:9) graphic, so
     the hero box is locked to that ratio at full story width rather than
     an arbitrary % of height. Its rounded corners carry real alpha, so the
     page background shows through them as a subtle inset-card edge. */
  .hero {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
  }

  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(10, 10, 10, 0) 55%,
      rgba(10, 10, 10, 0.6) 82%,
      var(--bg) 100%
    );
  }

  /* 3 & 4. Headline + promo badge */
  .content {
    position: relative;
    padding: 0 64px;
    margin-top: 96px;
  }

  .headline {
    font-family: 'Anton', sans-serif;
    font-weight: 400; /* Anton is already a black weight */
    text-transform: uppercase;
    font-size: 140px;
    line-height: 1;
    letter-spacing: 1px;
    color: var(--white);
  }

  .headline .accent { color: var(--accent); }

  .venue-line {
    margin-top: 16px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: 1px;
    color: rgba(255, 255, 255, 0.5);
  }

  /* Ticket-style badge: solid gradient fill + dashed stub divider, set apart
     from the plain outlined pill this replaced. Positioned absolutely so it
     can be centered in the gap between the location line and the team
     section below, independent of either one's exact height. */
  .promo {
    position: absolute;
    left: 64px;
    top: 1108px;
    display: inline-flex;
    align-items: center;
    gap: 24px;
    background: linear-gradient(135deg, var(--accent), #00a381);
    border-radius: 18px;
    padding: 22px 38px;
    box-shadow: 0 14px 32px rgba(0, 224, 168, 0.22);
  }

  .promo-icon {
    font-size: 36px;
    line-height: 1;
  }

  .promo-divider {
    width: 0;
    align-self: stretch;
    border-left: 2px dashed rgba(10, 10, 10, 0.35);
  }

  .promo-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .promo-label {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(10, 10, 10, 0.6);
  }

  .promo-code {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 38px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #0a0a0a;
  }

  /* 5. Team cards — stacked full-width rows so the larger photos and
     names have room to breathe without wrapping mid-word. */
  .speakers-label {
    position: absolute;
    bottom: 596px;
    left: 64px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
  }

  .speakers {
    position: absolute;
    bottom: 96px;
    left: 64px;
    right: 64px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  .speaker-card {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .speaker-photo {
    width: 210px;
    height: 210px;
    border-radius: 22px;
    object-fit: cover;
    flex-shrink: 0;
    background: #1a1a1a;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .speaker-info { min-width: 0; }

  .speaker-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 52px;
    line-height: 1.08;
    text-transform: uppercase;
    color: var(--white);
  }

  .speaker-role {
    margin-top: 12px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 0.5px;
    color: var(--accent);
  }

  /* ===== Print / export handling =====
     Use the browser's Print (Ctrl/Cmd+P) -> "Save as PDF" or a screenshot
     extension while the toolbar is hidden. @page keeps the sheet the same
     pixel dimensions as the card so nothing gets scaled or cropped. */
  @media print {
    .toolbar { display: none !important; }
    html, body {
      background: var(--bg);
      padding: 0;
      margin: 0;
    }
    .story {
      box-shadow: none;
    }
  }

  @page {
    size: 1080px 1920px;
    margin: 0;
  }
</style>
</head>
<body>

  <div class="toolbar">
    <button onclick="window.print()">Save as image / PDF</button>
  </div>

  <div class="story">

    <!-- 1 & 2. Hero photo — the banner already carries the logo, dates
         and venue, so it doubles as the branding block too. -->
    <div class="hero">
      <img src="./photo.png" alt="Blockchain.Rio 2026 — August 12-13, ExpoRio">
    </div>

    <!-- 3 & 4. Headline + promo badge -->
    <div class="content">
      <div class="headline">Blockchain<br><span class="accent">.Rio</span></div>
      <div class="venue-line">&#128205; ExpoRio, Rio de Janeiro, Brazil &middot; August 12&ndash;13</div>
    </div>

    <!-- Promo badge, centered between the location line and the team below -->
    <div class="promo">
      <span class="promo-icon">&#127915;</span>
      <span class="promo-divider"></span>
      <div class="promo-text">
        <span class="promo-label">Promo code</span>
        <span class="promo-code">BRIO10OFFICODA</span>
      </div>
    </div>

    <!-- 5. ICODA team at the event -->
    <div class="speakers-label">Meet us there</div>
    <div class="speakers">
      <div class="speaker-card">
        <img class="speaker-photo" src="./speaker1.jpg" alt="Artem Voinov">
        <div class="speaker-info">
          <div class="speaker-name">Artem Voinov</div>
          <div class="speaker-role">CBDO</div>
        </div>
      </div>
      <div class="speaker-card">
        <img class="speaker-photo" src="./speaker2.jpg" alt="Sergey Nelyubin">
        <div class="speaker-info">
          <div class="speaker-name">Sergey Nelyubin</div>
          <div class="speaker-role">CFO</div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
