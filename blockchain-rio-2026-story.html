<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockchain.Rio 2026 — Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #00e0a8;       /* swap this to re-theme the whole card */
    --bg: #0a0a0a;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #1c1c1c;
    font-family: 'Inter', sans-serif;
  }

  /* On-screen preview chrome — none of this exports, it just frames the story
     card so it's easy to see at real size in a browser tab. */
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 40px 20px;
  }

  .toolbar {
    display: flex;
    gap: 12px;
  }

  .toolbar button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
  }

  .toolbar button:hover { opacity: 0.85; }

  /* ===== The exportable story card: fixed 1080x1920 ===== */
  .story {
    position: relative;
    width: 1080px;
    height: 1920px;
    background: var(--bg);
    overflow: hidden;
    color: var(--white);
    flex-shrink: 0;
  }

  /* 1. Top-left logo / branding */
  .brand {
    position: absolute;
    top: 64px;
    left: 64px;
    z-index: 5;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    letter-spacing: 0.5px;
    line-height: 1;
  }

  .brand .brand-main {
    font-size: 40px;
    color: var(--white);
    text-transform: uppercase;
  }

  .brand .brand-accent {
    color: var(--accent);
  }

  /* 2. Hero photo, ~55% of height, with bottom gradient */
  .hero {
    position: relative;
    width: 100%;
    height: 55%;
  }

  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(10, 10, 10, 0) 45%,
      rgba(10, 10, 10, 0.55) 70%,
      var(--bg) 100%
    );
  }

  /* 3 & 4. Headline + date, sitting over the faded-to-black zone */
  .content {
    position: relative;
    padding: 0 64px;
    margin-top: -140px;
  }

  .headline {
    font-family: 'Anton', sans-serif;
    font-weight: 400; /* Anton is already a black weight */
    text-transform: uppercase;
    font-size: 96px;
    line-height: 1;
    letter-spacing: 1px;
    color: var(--white);
  }

  .headline .accent { color: var(--accent); }

  .date-line {
    margin-top: 28px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 40px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.85);
  }

  .venue-line {
    margin-top: 6px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 24px;
    letter-spacing: 1px;
    color: rgba(255, 255, 255, 0.5);
  }

  /* 5. Speaker cards row */
  .speakers {
    position: absolute;
    bottom: 72px;
    left: 64px;
    right: 64px;
    display: flex;
    gap: 32px;
  }

  .speaker-card {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .speaker-photo {
    width: 128px;
    height: 128px;
    border-radius: 14px;
    object-fit: cover;
    flex-shrink: 0;
    background: #1a1a1a;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .speaker-info { min-width: 0; }

  .speaker-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 32px;
    line-height: 1.08;
    text-transform: uppercase;
    color: var(--white);
    word-break: break-word;
  }

  .speaker-role {
    margin-top: 6px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.5px;
    color: var(--accent);
  }

  /* ===== Print / export handling =====
     Use the browser's Print (Ctrl/Cmd+P) -> "Save as PDF" or a screenshot
     extension while the toolbar is hidden. @page keeps the sheet the same
     pixel dimensions as the card so nothing gets scaled or cropped. */
  @media print {
    .toolbar { display: none !important; }
    html, body {
      background: var(--bg);
      padding: 0;
      margin: 0;
    }
    .story {
      box-shadow: none;
    }
  }

  @page {
    size: 1080px 1920px;
    margin: 0;
  }
</style>
</head>
<body>

  <div class="toolbar">
    <button onclick="window.print()">Save as image / PDF</button>
  </div>

  <div class="story">

    <!-- 1. Top-left logo area -->
    <div class="brand">
      <span class="brand-main">BLOCKCHAIN<span class="brand-accent">.RIO</span></span>
    </div>

    <!-- 2. Hero photo with dark gradient overlay -->
    <div class="hero">
      <img src="./photo.jpg" alt="Event photo">
    </div>

    <!-- 3 & 4. Headline + date -->
    <div class="content">
      <div class="headline">
        BLOCKCHAIN<br>
        <span class="accent">.RIO</span><br>
        2026
      </div>
      <div class="date-line">12&ndash;13 August</div>
      <div class="venue-line">ExpoRio</div>
    </div>

    <!-- 5. Speaker cards -->
    <div class="speakers">
      <div class="speaker-card">
        <img class="speaker-photo" src="./speaker1.jpg" alt="Artem Voinov">
        <div class="speaker-info">
          <div class="speaker-name">Artem<br>Voinov</div>
          <div class="speaker-role">CBDO</div>
        </div>
      </div>
      <div class="speaker-card">
        <img class="speaker-photo" src="./speaker2.jpg" alt="Sergey Nelyubin">
        <div class="speaker-info">
          <div class="speaker-name">Sergey<br>Nelyubin</div>
          <div class="speaker-role">CFO</div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
